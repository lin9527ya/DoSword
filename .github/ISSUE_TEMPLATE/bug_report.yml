name: Bug 报告
description: 报告一个可复现的缺陷（非安全问题）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**安全漏洞请勿在此提交** —— 请走
        [私密漏洞上报](https://github.com/lin9527ya/DoSword/security/advisories/new)，详见 SECURITY.md。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
        - label: 这不是安全漏洞（安全问题走私密上报）
          required: true
        - label: 我已在最新 `main` 上复现
          required: true

  - type: input
    id: version
    attributes:
      label: DoSword 版本
      description: 应用内「设置」页可见，或填 commit short SHA
      placeholder: "0.1.0 (cd9a298)"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: 相关协议
      description: 与具体协议无关（如界面问题）请选「不适用」
      options:
        - PHP
        - JSP
        - ASP.NET
        - 经典 ASP
        - Mock（scripts/mock_shell.py）
        - 不适用 / 通用
    validations:
      required: true

  - type: input
    id: encoder
    attributes:
      label: 编码方式
      description: 涉及载荷协议时填写，如 native / native_chacha20 / native_aes_cbc
      placeholder: "native_chacha20"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 实际发生了什么？期望是什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: |
        最小复现步骤。**请优先用 `scripts/mock_shell.py` 构造**，不要贴真实目标地址
        （真实 endpoint 会被要求脱敏后重开）。
      placeholder: |
        1. 启动 mock：python3 scripts/mock_shell.py --port 18080 --password secret
        2. 登记 Shell http://127.0.0.1:18080/shell.php
        3. 打开文件管理器，点击 ...
        4. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: |
        相关日志、控制台输出或截图。**提交前请删除密码、真实 IP / 域名、URL 与响应内容**。
        应用内「请求调试」页可查看协议帧（密码已自动脱敏）。
      render: shell
    validations:
      required: false
