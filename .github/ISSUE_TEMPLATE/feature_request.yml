name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 README 的「路线图」章节
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景与痛点，而不是直接给方案 —— 先说清"为什么需要"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有功能或变通做法为什么不够？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 协议 / 编码器
        - 文件管理
        - 命令终端
        - 数据库管理
        - 插件体系
        - 授权 / 审计
        - 界面 / 交互
        - 构建 / 打包
        - 其他
    validations:
      required: true
