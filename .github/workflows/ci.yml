name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 支持从 Actions 页面或 `gh workflow run CI` 手动触发（例如重跑以排查不稳定用例）
  workflow_dispatch:

jobs:
  rust:
    name: Rust 检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖（Tauri）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev             libayatana-appindicator3-dev patchelf
        if: runner.os == 'Linux'

      - name: 安装 Rust 工具链（版本与 rust-toolchain.toml 一致，不用浮动的 stable）
        # 钉死版本：clippy -D warnings 门禁下，stable 引入新 lint 会让 CI 无预警变红。
        # 升级工具链时同步改 rust-toolchain.toml 与本行的版本号。
        # .github/workflows/ci.yml
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Clippy（零警告门禁）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 格式化检查
        run: cargo fmt --check

      - name: 单元测试（含真实 PHP 往返，php 缺失即失败而非跳过）
        run: |
          sudo apt-get install -y php-cli || true
          DOSWORD_REQUIRE_PHP=1 cargo test --workspace

  frontend:
    name: 前端类型与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：pnpm 版本以 package.json 的 packageManager 字段为准，
      # 避免本地与 CI 版本漂移（pnpm 10+ 已把配置从 package.json 迁到 pnpm-workspace.yaml）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24：pnpm 11 要求 Node >= 22.13（依赖 node:sqlite 内置模块），
          # 且与本地开发环境（v24）保持一致
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm check

      - name: 版本一致性（package.json / Cargo.toml / tauri.conf.json / tag）
        run: pnpm check:version

      - name: IPC 契约检查（前端 invoke ↔ 后端命令注册）
        run: pnpm check:ipc

      - name: Lint（含 react-hooks 规则）
        run: pnpm lint

      - name: 前端单测（vitest）
        run: pnpm test

      - name: 构建
        run: pnpm build

  security:
    name: 密钥与依赖扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 需要完整历史才能扫出历史提交里的密钥
          fetch-depth: 0

      - name: gitleaks 密钥扫描（全历史）
        run: |
          GITLEAKS_VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --no-banner --exit-code 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 前端依赖漏洞扫描
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

      - name: 安装 cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust 依赖漏洞扫描
        # 只对 vulnerability 失败；unmaintained / unsound / yanked 属 warning，不阻塞
        # 忽略项与 deny.toml 的 advisories.ignore 保持一致：
        # wasmtime 49.0.3 的两条公告（crates.io 尚无 49.0.4/48.0.7 稳定版）。
        # 上游发布修复版本后：cargo update -p wasmtime，并同时删除此处的 --ignore 与 deny.toml 条目。
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0378
          --ignore RUSTSEC-2026-0379

      - name: 依赖策略（cargo-deny：许可 / 来源 / 重复版本 / yanked）
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
