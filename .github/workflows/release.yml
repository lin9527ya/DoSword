name: Release

# 仅在打 tag（v*）或手动触发时运行，不影响 main 的 CI。
# 产物：三平台 dosword-cli 二进制（未签名）+ 三平台桌面安装包（未签名）。
# 签名：配置 TAURI_SIGNING_PRIVATE_KEY / _PASSWORD 后 tauri-action 会自动签名，
#       未配置则产出未签名包（内部评估可用，不要对外分发）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 版本守卫先行：tag 与代码版本不一致时，后续 job 全部不跑，避免产出
  # 「tag 说 0.2.0、二进制里是 0.1.0」的包。
  guard:
    name: 版本守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 校验 tag 与 package.json / Cargo.toml / tauri.conf.json 一致
        run: node scripts/check-version.mjs

  cli:
    name: 构建 dosword-cli（${{ matrix.artifact }}）
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bin: dosword-cli
            artifact: dosword-cli-linux-x64
          - os: windows-latest
            bin: dosword-cli.exe
            artifact: dosword-cli-windows-x64
          - os: macos-14
            bin: dosword-cli
            artifact: dosword-cli-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖（Tauri 传递依赖）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装 Rust 工具链（版本来自 rust-toolchain.toml）
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --no-default-features：裁掉 mcp / wasm（CLI 不需要），显著加快构建
      - name: 构建 CLI
        run: cargo build --release --no-default-features --bin dosword-cli

      - name: 生成校验和
        shell: bash
        run: |
          cd target/release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.bin }}" > "${{ matrix.bin }}.sha256"
          else
            shasum -a 256 "${{ matrix.bin }}" > "${{ matrix.bin }}.sha256"
          fi
          cat "${{ matrix.bin }}.sha256"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/${{ matrix.bin }}
            target/release/${{ matrix.bin }}.sha256
          if-no-files-found: error

  desktop:
    name: 桌面安装包（${{ matrix.platform }}）
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          # 版本取自 package.json 的 packageManager 字段（pnpm@11.21.0）
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Rust 工具链（版本来自 rust-toolchain.toml）
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand（pnpm build）由 tauri 自己执行，这里不重复构建
      - name: 构建安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tag 触发时创建草稿 Release；手动触发只产 artifact，不碰 Release
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: true

      - name: 上传安装包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dosword-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/**/release/bundle/**
          if-no-files-found: warn
