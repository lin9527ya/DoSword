[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/dosword-sdk",
  "crates/dosword-plugin-echo",
  "crates/dosword-plugin-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# 发布构建优化（P9）：LTO + 单 codegen 单元 + strip，减小体积、提升启动速度。
# 代价是 release 构建时间变长（首次约数分钟）。
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
ts-rs = { version = "10", features = ["serde-compat"] }
md-5 = "0.10"
aes = "0.8"
des = "0.8"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
crc32fast = "1.4"
flate2 = "1"
