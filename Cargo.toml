[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/dosword-sdk",
  "crates/dosword-plugin-echo",
  "crates/dosword-plugin-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "面向授权安全测试的现代化 WebShell 管理客户端（Tauri 2 + React 19 + Rust）"
authors = ["lin9527ya <205146425+lin9527ya@users.noreply.github.com>"]
repository = "https://github.com/lin9527ya/DoSword"
keywords = ["webshell", "security", "pentest", "tauri", "red-team"]
categories = ["command-line-utilities", "development-tools"]

# 构建优化：dev 快速增量 + release 体积与速度兼顾
[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 16

[profile.dev.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[profile.release-with-debug]
inherits = "release"
strip = false
debug = 1

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
ts-rs = { version = "10", features = ["serde-compat"] }
md-5 = "0.10"
aes = "0.8"
des = "0.8"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
crc32fast = "1.4"
flate2 = "1"
lru = "0.12"
parking_lot = "0.12"
