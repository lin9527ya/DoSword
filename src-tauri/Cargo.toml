[package]
name = "dosword"
license = "MIT"
version.workspace = true
description = "面向授权安全测试的 WebShell 管理客户端（Tauri 桌面应用）"
authors.workspace = true
repository.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dosword_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["mcp", "wasm"]
# MCP 服务端（把 DoSword 能力暴露给 AI 客户端）。关闭后不编译该模块、
# 也不引入 rmcp/axum 依赖树（减小二进制体积与攻击面）。
mcp = ["dep:rmcp", "dep:axum", "dep:schemars", "dep:tokio-util"]
# WASM 沙箱插件（W6）：wasmtime 运行时 + 能力声明校验。
# 关闭后可完全裁掉 wasmtime/cranelift 依赖树。
wasm = ["dep:wasmtime"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
flate2.workspace = true
thiserror.workspace = true
url = "2"
uuid.workspace = true
base64.workspace = true
aes-gcm.workspace = true
# 密钥保管：优先系统钥匙串（Linux Secret Service / Windows Credential Manager /
# macOS Keychain）；不可用时回落到数据目录内的 0600 密钥文件（见 secrets.rs）
keyring = "4"
encoding_rs = "0.8"
libloading = "0.8"
getrandom = "0.3"
ipnet = "2"
lru.workspace = true
parking_lot.workspace = true
ts-rs.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "charset", "cookies", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
dosword-sdk = { path = "../crates/dosword-sdk" }
dosword-plugin-echo = { path = "../crates/dosword-plugin-echo" }

# —— MCP 服务端（可选依赖，见 [features].mcp） ——
# 锁定补丁版本：rmcp 处于 3.x 快速演进期，工具层与 SDK 之间另有自有 trait 隔离。
rmcp = { version = "=3.5.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
schemars = { version = "1", features = ["derive"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
wasmtime = { version = "49.0.3", default-features = false, features = ["cranelift", "runtime", "wat"], optional = true }
clap = { version = "4.6.7", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
wat = "1.262.0"
