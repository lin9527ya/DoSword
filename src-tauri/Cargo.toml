[package]
name = "dosword"
version.workspace = true
description = "面向授权安全测试的 WebShell 管理客户端（Tauri 桌面应用）"
authors.workspace = true
repository.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dosword_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
flate2.workspace = true
thiserror.workspace = true
url = "2"
uuid.workspace = true
base64.workspace = true
encoding_rs = "0.8"
libloading = "0.8"
getrandom = "0.3"
ipnet = "2"
lru.workspace = true
parking_lot.workspace = true
ts-rs.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "charset", "cookies", "socks"] }
dosword-sdk = { path = "../crates/dosword-sdk" }
dosword-plugin-echo = { path = "../crates/dosword-plugin-echo" }
