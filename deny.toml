# cargo-deny 依赖策略（与既有 cargo-audit 互补：audit 只看漏洞，这里还管许可、来源、重复版本）
#
# 本地校验：cargo deny check
# CI：见 .github/workflows/ci.yml 的「依赖策略（cargo-deny）」步骤

[graph]
# 全平台都检查：Windows 专属依赖（webview2-com 等）也要过许可与来源
all-features = true

[advisories]
version = 2
# 被 yank 的版本不允许出现（能拉到说明 lockfile 需要修）
yanked = "deny"
# unmaintained / unsound 交给 cargo audit 报告（它已在 CI 里跑并会打印这些）；
# 这里关掉以免同一件事报两遍。cargo-deny 0.20 的取值是 none/workspace/transitive/all。
unmaintained = "none"
unsound = "none"
# 已知但暂时无法修复的公告：写清原因与解除条件，避免被当成"没看见"。
# 解除条件：wasmtime 发布 49.0.4+ 后执行 cargo update -p wasmtime 并删除对应条目。
ignore = [
    # 仅在 aarch64 Cranelift 后端 + 超大 br_table 触发；本项目 wasm 插件跑在 x86_64
    "RUSTSEC-2026-0379",
    # 同上，上游 GHSA-mghf-wjfp-p5xm；49.0.4 / 48.0.7 才修，crates.io 目前只有 50.0.0-rc.1
    "RUSTSEC-2026-0378",
]

[licenses]
version = 2
# 白名单：只允许宽松/商业友好的常见许可。
# 新增依赖若命中未列出的许可，CI 会失败——这是有意的：许可变更需要人工确认。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
# 允许双许可（如 "MIT OR Apache-2.0"）里任一命中
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# 工作区内部的 path 依赖本身就不写版本号（cargo 以 path 为准），不算"通配版本"，\n# 真正要防的是 `version = "*"` 这类来自 crates.io 的通配——那由 sources/multiple-versions 兜底。\nwildcards = "warn"
# 任何新增的 git 依赖都需要显式评审
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
